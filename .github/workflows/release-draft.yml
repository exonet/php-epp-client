---
# Keeps the release draft up to date on every push to master. Publishing the
# draft creates the tag that composer resolves this fork by.
#
# A public repo may only use reusable workflows from public repos, so the shared
# ones in the private exonet/github-workflows are out of reach. Like the other
# public repos, this one carries its own copy and its own config.
name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  update-release-draft:
    name: Update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Run release drafter
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
